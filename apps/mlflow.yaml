apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rania4363/mlsecops-platform.git
    targetRevision: main
    path: mlops/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        signed-images: required
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
