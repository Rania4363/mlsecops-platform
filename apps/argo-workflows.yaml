apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 2.0.18
    helm:
      valuesObject:
        controller:
          workflowNamespaces:
            - ml-training
        server:
          authModes:
            - client
        workflow:
          serviceAccount:
            create: true
            name: argo-workflow
          rbac:
            create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
