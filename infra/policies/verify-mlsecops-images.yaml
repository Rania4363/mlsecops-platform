apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-mlsecops-images
spec:
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    mode: Kubernetes
  matchConstraints:
    namespaceSelector:
      matchLabels:
        signed-images: required
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/rania4363/*"
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/Rania4363/mlsecops-images/.github/workflows/mlflow.yml@refs/heads/main"
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/Rania4363/mlsecops-images/.github/workflows/training.yml@refs/heads/main"
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/Rania4363/mlsecops-images/.github/workflows/agent.yml@refs/heads/main"
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/Rania4363/mlsecops-images/.github/workflows/serving.yml@refs/heads/main"
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: "image non signée par le workflow mlsecops-images"
