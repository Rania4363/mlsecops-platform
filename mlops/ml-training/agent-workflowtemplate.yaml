apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: churn-agent-observe
  namespace: ml-training
spec:
  entrypoint: observe
  serviceAccountName: argo-workflow-runner
  ttlStrategy:
    secondsAfterCompletion: 3600
  templates:
    - name: observe
      container:
        image: ghcr.io/rania4363/churn-agent:3@sha256:676ce1c5ec851fcd54a7210212dbfc07bee4be0827cbc6b29b4aac318d29943c
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow:5000
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
