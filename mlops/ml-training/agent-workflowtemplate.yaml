apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: churn-agent-observe
  namespace: ml-training
spec:
  entrypoint: observe
  serviceAccountName: argo-workflow-runner
  ttlStrategy:
    secondsAfterCompletion: 3600
  templates:
    - name: observe
      container:
        image: ghcr.io/rania4363/churn-agent:2@sha256:d9a80eb05309cd924d1bc1eb49fe3d539e9e58dfbbc042a0908e9e21c59b632b
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow:5000
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
