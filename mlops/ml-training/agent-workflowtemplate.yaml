apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: churn-agent-observe
  namespace: ml-training
spec:
  entrypoint: observe
  serviceAccountName: argo-workflow-runner
  ttlStrategy:
    secondsAfterCompletion: 3600
  templates:
    - name: observe
      container:
        image: ghcr.io/rania4363/churn-agent:4@sha256:ebc116b0cbf9ca819c9e035c770193717f0bb0b9d939ecdb82e89bb4291add2d
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow:5000
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
