apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: churn-training
  namespace: ml-training
spec:
  entrypoint: train
  serviceAccountName: argo-workflow-runner
  ttlStrategy:
    secondsAfterCompletion: 3600
  arguments:
    parameters:
      - name: drift
        value: "0.0"
      - name: n-samples
        value: "5000"
  templates:
    - name: train
      container:
        image: ghcr.io/rania4363/churn-training:3@sha256:546bd0c68f2c4a619a22f1e1e56dbe9f6a95a11773088066f7a72c975669bc59
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow:5000
          - name: DRIFT
            value: "{{workflow.parameters.drift}}"
          - name: N_SAMPLES
            value: "{{workflow.parameters.n-samples}}"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
