apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: churn-training
  namespace: ml-training
spec:
  entrypoint: train
  serviceAccountName: argo-workflow-runner
  ttlStrategy:
    secondsAfterCompletion: 3600
  arguments:
    parameters:
      - name: drift
        value: "0.0"
      - name: concept
        value: "0.0"
      - name: n-samples
        value: "5000"
  templates:
    - name: train
      container:
        image: ghcr.io/rania4363/churn-training:9@sha256:8e22ec6230d7c9df16ada33a6891778e3f580a401dea6d044d7c938dae2f4f67
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow:5000
          - name: DRIFT
            value: "{{workflow.parameters.drift}}"
          - name: CONCEPT
            value: "{{workflow.parameters.concept}}"
          - name: N_SAMPLES
            value: "{{workflow.parameters.n-samples}}"
          - name: GIT_PYTHON_REFRESH
            value: quiet
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
