apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-runner
  namespace: ml-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-runner
  namespace: ml-training
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-runner
  namespace: ml-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow-runner
subjects:
  - kind: ServiceAccount
    name: argo-workflow-runner
    namespace: ml-training
