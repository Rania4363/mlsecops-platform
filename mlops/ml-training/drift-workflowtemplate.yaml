apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: churn-drift-check
  namespace: ml-training
spec:
  entrypoint: check
  serviceAccountName: argo-workflow-runner
  ttlStrategy:
    secondsAfterCompletion: 3600
  arguments:
    parameters:
      - name: drift
        value: "0.0"
      - name: n-samples
        value: "2000"
  templates:
    - name: check
      container:
        image: ghcr.io/rania4363/churn-training:5@sha256:eacf3130d9f51a73b4511762d9288abb7985ab57a9349b72cdd0e11037fb74af
        command: ["python", "drift.py"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow:5000
          - name: DRIFT
            value: "{{workflow.parameters.drift}}"
          - name: N_SAMPLES
            value: "{{workflow.parameters.n-samples}}"
          - name: GIT_PYTHON_REFRESH
            value: quiet
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
